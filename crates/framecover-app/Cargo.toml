[package]
name = "framecover"
description = "Pick any frame of a video and make it the file's thumbnail"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Slint 1.18 requires Rust 1.92 (the core crate keeps the workspace MSRV).
rust-version = "1.92"
build = "build.rs"

[[bin]]
name = "framecover"
path = "src/main.rs"

[dependencies]
framecover-core = { path = "../framecover-core" }
# GUI toolkit, used under the Slint Royalty-free License 2.0 (see the About
# dialog, which shows the required AboutSlint attribution).
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "raw-window-handle-06",
    # Access to winit window events for OS file drag-and-drop.
    "unstable-winit-030",
] }
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false }
rand = "0.9.2"
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.34"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
liblzma = "0.4.9"
tempfile = "3.27.0"
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
winreg = "0.55.0"

[build-dependencies]
hex = "0.4.3"
liblzma = "0.4.9"
sha2 = "0.11.1"
slint-build = "1.18.1"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
