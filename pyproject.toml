[project]
name = "video-thumbnailer"
version = "0.1.0"
description = "Change the thumbnail icon of a video file displayed by OS file managers"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "av>=12.0",
    "Pillow>=10.3",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.0",
]

[project.scripts]
video-thumbnailer = "video_thumbnailer.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
branch = true
source = ["video_thumbnailer"]
